name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve mod version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build all Minecraft versions
        run: |
          chmod +x ./gradlew
          ./gradlew build -Pmod.version=${{ steps.version.outputs.value }} --stacktrace

      - name: Collect jars
        run: |
          mkdir -p dist
          cp versions/*/build/libs/*.jar dist/
          ls -l dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.jar \
            --title "PrayTeamView ${{ steps.version.outputs.value }}" \
            --generate-notes
